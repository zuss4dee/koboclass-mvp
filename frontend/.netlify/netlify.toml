redirectsOrigin = "config"
plugins = []

[functions]

[functions."*"]

[build]
publish = "/Users/damilareadeosun/koboclass-mvp/frontend/dist"
publishOrigin = "config"
commandOrigin = "config"
base = "/Users/damilareadeosun/koboclass-mvp/frontend"
command = "npm run build"

[build.environment]
NODE_VERSION = "18"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[[headers]]
for = "/*"

[headers.values]
Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.png"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.jpg"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.jpeg"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.webp"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.svg"

[headers.values]
Cache-Control = "public, max-age=86400"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200.0
force = false

